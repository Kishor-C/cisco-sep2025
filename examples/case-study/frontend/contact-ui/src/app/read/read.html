<div>
    <h2>Fetch Profile based on id</h2>
    <h4>Enter id</h4>
    <input type = "number" class="form-control form-control-lg w-25" #tf>
    <br />
    <button class="btn btn-lg btn-primary w-25" (click) = "handleRefresh(+tf.value)">Search</button>
    <div *ngIf = "profile" class = "alert alert-success w-50">
        {{ profile | json}}
    </div>
    <div *ngIf = "message" class = "alert alert-danger w-50">
        {{message.error | json}}
    </div>
</div>
